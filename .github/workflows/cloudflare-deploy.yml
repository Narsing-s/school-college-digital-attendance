name: Cloudflare Workers Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: attendance-worker
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Cloudflare credentials
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - run: npm run deploy
