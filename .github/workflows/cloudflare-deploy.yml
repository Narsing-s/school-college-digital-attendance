name: Cloudflare D1 + Workers Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cloudflare-attendance
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - name: Configure D1 database
        shell: bash
        run: |
          test -n "${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}"
          sed -i "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}/" wrangler.jsonc
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply school-college-attendance --remote
      - name: Set Worker secrets
        shell: bash
        run: |
          printf '%s' "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then printf '%s' "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY; fi
          if [ -n "${{ secrets.EMAIL_FROM }}" ]; then printf '%s' "${{ secrets.EMAIL_FROM }}" | npx wrangler secret put EMAIL_FROM; fi
      - name: Deploy Worker
        run: npm run deploy
