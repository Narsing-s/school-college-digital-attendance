name: Cloudflare D1 + Workers Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-attendance
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Resolve D1 database
        shell: bash
        run: |
          DB_ID="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const rows=Array.isArray(a)?a:(a.result||[]);const x=rows.find(r=>r.name==="school-college-attendance");process.stdout.write(x ? x.uuid : "")})')"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create school-college-attendance --update-config
          else
            sed -i "s/REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID/$DB_ID/" wrangler.jsonc
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply school-college-attendance --remote
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${{ secrets.SESSION_SECRET }}" || { echo "Missing SESSION_SECRET"; exit 1; }
      - name: Set Worker secrets
        shell: bash
        run: |
          printf '%s' "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then printf '%s' "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY; fi
          if [ -n "${{ secrets.EMAIL_FROM }}" ]; then printf '%s' "${{ secrets.EMAIL_FROM }}" | npx wrangler secret put EMAIL_FROM; fi
      - name: Deploy Worker
        run: npm run deploy
